<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#416b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>拾光计划 · 个人管理</title>
<style>
:root{--bg:#f5f6f2;--paper:#fff;--ink:#20342b;--muted:#78847c;--green:#416b55;--green2:#e4eee6;--line:#e6eae5;--orange:#d58b4d;--red:#c85c55;--shadow:0 8px 24px #1c33240c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0} .app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:24px 20px 18px;background:linear-gradient(135deg,#315843,#5d8067);color:white;border-radius:0 0 26px 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:800;letter-spacing:.5px}.sub{opacity:.8;font-size:12px}.today{margin-top:22px;font-size:13px;opacity:.85}.headline{font-size:25px;font-weight:750;margin-top:4px}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.metric{padding:12px;background:#ffffff18;border:1px solid #ffffff20;border-radius:15px}.metric b{font-size:21px;display:block}.metric span{font-size:11px;opacity:.85}
main{padding:18px 14px}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.tab{flex:0 0 auto;padding:10px 14px;border-radius:12px;background:#e9ece7;color:#536359;font-weight:650}.tab.active{background:var(--green);color:#fff}.section-head{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 12px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}.primary{background:var(--green);color:white;border-radius:12px;padding:10px 14px;font-weight:700}.secondary{background:var(--green2);color:var(--green);border-radius:10px;padding:8px 11px;font-weight:650}.danger{background:#fae8e6;color:var(--red);border-radius:10px;padding:8px 10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.task{display:flex;align-items:flex-start;gap:11px}.check{appearance:none;width:22px;height:22px;border:1.8px solid #aab7ad;border-radius:7px;margin-top:2px;flex:0 0 auto;position:relative}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:"✓";color:white;position:absolute;left:4px;top:-1px;font-size:15px;font-weight:800}.task-body{flex:1;min-width:0}.task-title{font-weight:750;word-break:break-word}.done .task-title{text-decoration:line-through;color:#929b94}.pill{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;background:#eef1ed;color:#66766b;margin:5px 4px 0 0}.pill.high{background:#fae9df;color:#b76531}.pill.late{background:#fae8e6;color:#b84f48}.task-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.progress{height:7px;background:#edf0eb;border-radius:20px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty .emoji{font-size:32px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.statbox strong{font-size:25px;display:block}.statbox small{color:var(--muted)}.barrow{display:grid;grid-template-columns:66px 1fr 34px;align-items:center;gap:8px;margin:11px 0;font-size:12px}.bar{height:9px;background:#edf0eb;border-radius:20px;overflow:hidden}.bar span{height:100%;display:block;background:#5b8669;border-radius:20px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendar-head button{background:var(--green2);color:var(--green);border-radius:9px;padding:7px 11px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{min-height:48px;border-radius:10px;background:#f6f7f4;text-align:center;padding:6px 0;font-size:13px;position:relative}.day.dim{opacity:.35}.day.selected{background:var(--green);color:white}.day.today:not(.selected){outline:1px solid var(--green)}.dot{width:5px;height:5px;background:#d58b4d;border-radius:50%;margin:3px auto 0}.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe5de;border-radius:11px;padding:11px;background:#fbfcfa;color:var(--ink);outline-color:var(--green)}textarea{resize:vertical;min-height:105px}.modal{position:fixed;inset:0;background:#13231db0;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:0}.modal.open{display:flex}.sheet{background:var(--bg);width:100%;max-width:650px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 17px calc(24px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet-head h2{margin:0;font-size:20px}.close{font-size:24px;background:transparent;color:var(--muted)}.form-actions{display:flex;gap:9px;margin-top:18px}.form-actions button{flex:1;padding:12px}.history-item{border-left:2px solid #c9d9cc;padding:0 0 14px 13px;margin-left:5px;position:relative}.history-item:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);position:absolute;left:-5px;top:5px}.history-item b{font-size:13px}.history-item p{margin:4px 0;font-size:12px;color:#5c6a60;white-space:pre-wrap;word-break:break-word}.history-item time{font-size:11px;color:var(--muted)}.note-title{font-weight:750;font-size:16px}.note-content{white-space:pre-wrap;overflow-wrap:anywhere;color:#56645a;margin-top:6px}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:white}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 7px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:4}.nav-inner{display:flex;width:min(700px,100%);justify-content:space-around}.navbtn{background:transparent;color:#7d8980;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:55px}.navbtn .ico{font-size:20px}.navbtn.active{color:var(--green);font-weight:800}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#243c2e;color:white;padding:10px 15px;border-radius:12px;z-index:10;display:none;max-width:90%;font-size:13px}.small-actions{display:flex;gap:6px;align-items:center}.hidden{display:none!important}
@media(min-width:700px){header{margin-top:18px;border-radius:26px}.app{padding:0 18px 30px}.bottom-nav{position:sticky;border:1px solid var(--line);border-radius:18px;margin:0 auto 18px;max-width:600px;bottom:12px}.sheet{border-radius:22px;margin-bottom:3vh}.modal{align-items:center;padding:15px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="top"><div><div class="brand">拾光计划 <span style="font-size:12px;font-weight:500;opacity:.8">PERSONAL SPACE</span></div><div class="sub">把想法记下来，把计划做起来</div></div><button class="secondary" id="backupBtn">导出备份</button></div>
 <div class="today" id="dateText"></div><div class="headline" id="greeting">今天，也向前一点点。</div>
 <div class="overview"><div class="metric"><b id="todayCount">0/0</b><span>今日完成</span></div><div class="metric"><b id="allProgress">0%</b><span>任务完成率</span></div><div class="metric"><b id="noteCount">0</b><span>备忘录</span></div></div>
</header>
<main>
 <div class="toolbar" id="tabs">
  <button class="tab active" data-view="today">今日</button><button class="tab" data-view="plans">计划表</button><button class="tab" data-view="notes">备忘录</button><button class="tab" data-view="calendar">日历</button><button class="tab" data-view="stats">统计</button><button class="tab" data-view="history">修改记录</button>
 </div>
 <section id="view"></section>
</main>
</div>
<div class="bottom-nav"><div class="nav-inner">
<button class="navbtn active" data-view="today"><span class="ico">☀️</span>今日</button><button class="navbtn" data-view="plans"><span class="ico">☑️</span>计划</button><button class="navbtn" id="quickAdd"><span class="ico" style="font-size:25px">＋</span>新建</button><button class="navbtn" data-view="calendar"><span class="ico">🗓️</span>日历</button><button class="navbtn" data-view="notes"><span class="ico">📝</span>备忘</button>
</div></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle">新建</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='shiguang_planner_v1';
let state=loadState(), view='today', selectedDate=iso(new Date()), calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), searchText='';
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function stamp(){return new Date().toISOString()}
function fmt(s){if(!s)return '未设置';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('zh-CN',{hour12:false})}
function today(){return iso(new Date())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{tasks:[],notes:[],history:[]}}catch(e){return {tasks:[],notes:[],history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderHeader()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function logChange(type,id,title,before,after,action='修改'){state.history.unshift({id:uid(),type,entityId:id,title,action,before:structuredClone(before),after:structuredClone(after),at:stamp()});if(state.history.length>1500)state.history.length=1500;save()}
function renderHeader(){const t=state.tasks.filter(x=>x.date===today()),done=t.filter(x=>x.done).length,all=state.tasks.length,complete=state.tasks.filter(x=>x.done).length;$('#dateText').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#todayCount').textContent=`${done}/${t.length}`;$('#allProgress').textContent=(all?Math.round(complete/all*100):0)+'%';$('#noteCount').textContent=state.notes.length;$('#greeting').textContent=done===t.length&&t.length?'今天的计划已完成，真棒！':'今天，也向前一点点。'}
function go(v){view=v;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function taskCard(t){const overdue=!t.done&&t.date&&t.date<today();return `<article class="card"><div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-check="${t.id}" ${t.done?'checked':''} aria-label="完成任务"><div class="task-body"><div class="task-title">${esc(t.title)}</div>${t.description?`<div class="muted" style="margin-top:4px;white-space:pre-wrap">${esc(t.description)}</div>`:''}<div><span class="pill">${esc(t.category||'默认')}</span>${t.priority==='高'?'<span class="pill high">高优先级</span>':''}${overdue?'<span class="pill late">已逾期</span>':''}<span class="pill">${t.date||'未安排日期'}</span></div><div class="progress"><span style="width:${t.done?100:t.progress||0}%"></span></div><div class="muted" style="margin-top:4px">进度 ${t.done?100:t.progress||0}% · 最后修改 ${fmt(t.updatedAt)}</div><div class="task-actions"><button class="secondary" data-edit-task="${t.id}">编辑</button><button class="secondary" data-history-id="${t.id}" data-history-type="task">历史</button><button class="danger" data-delete-task="${t.id}">删除</button></div></div></div></article>`}
function noteCard(n){return `<article class="card"><div class="note-title">${esc(n.title||'无标题')}</div><div class="note-content">${esc(n.content||'')}</div><div style="margin-top:8px"><span class="pill">${esc(n.category||'随手记')}</span><span class="pill">修改于 ${fmt(n.updatedAt)}</span></div><div class="task-actions"><button class="secondary" data-edit-note="${n.id}">编辑</button><button class="secondary" data-history-id="${n.id}" data-history-type="note">历史</button><button class="danger" data-delete-note="${n.id}">删除</button></div></article>`}
function empty(text){return `<div class="card empty"><div class="emoji">🌱</div><div>${text}</div><div class="muted" style="margin-top:5px">点击右上角或底部“新建”开始添加</div></div>`}
function render(){renderHeader();let el=$('#view');if(view==='today'){let list=state.tasks.filter(t=>t.date===today()).sort((a,b)=>(a.done-b.done)||a.title.localeCompare(b.title,'zh'));el.innerHTML=`<div class="section-head"><h2>今日计划</h2><button class="primary" data-new-task>＋ 添加计划</button></div><div class="muted" style="margin:0 2px 12px">把今天的重点做好就很棒。</div>${list.length?list.map(taskCard).join(''):empty('今天还没有安排计划') }<div class="section-head" style="margin-top:22px"><h2>近期任务</h2><button class="secondary" data-go-plans>查看全部</button></div>${state.tasks.filter(t=>!t.done&&t.date>today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(taskCard).join('')||'<div class="muted">暂时没有未来任务</div>'}`}
else if(view==='plans'){el.innerHTML=`<div class="section-head"><h2>全部计划</h2><button class="primary" data-new-task>＋ 新建计划</button></div><input class="search" id="taskSearch" placeholder="搜索计划标题、描述或分类…" value="${esc(searchText)}"><div class="toolbar"><button class="tab ${planFilter==='all'?'active':''}" data-filter="all">全部</button><button class="tab ${planFilter==='active'?'active':''}" data-filter="active">进行中</button><button class="tab ${planFilter==='done'?'active':''}" data-filter="done">已完成</button></div>${filteredTasks().length?filteredTasks().sort((a,b)=>(a.done-b.done)||((a.date||'').localeCompare(b.date||''))).map(taskCard).join(''):empty('没有找到计划')}`}
else if(view==='notes'){el.innerHTML=`<div class="section-head"><h2>我的备忘录</h2><button class="primary" data-new-note>＋ 新建备忘</button></div><input class="search" id="noteSearch" placeholder="搜索标题、内容或分类…" value="${esc(searchText)}">${state.notes.filter(n=>(n.title+' '+n.content+' '+n.category).toLowerCase().includes(searchText.toLowerCase())).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(noteCard).join('')||empty('还没有备忘录，记下第一个想法吧')}`}
else if(view==='calendar'){el.innerHTML=calendarHtml()}
else if(view==='stats'){el.innerHTML=statsHtml()}
else if(view==='history'){el.innerHTML=historyHtml()}
}
let planFilter='all';
function filteredTasks(){return state.tasks.filter(t=>(planFilter==='all'||(planFilter==='active'&&!t.done)||(planFilter==='done'&&t.done))&&(t.title+' '+t.description+' '+t.category).toLowerCase().includes(searchText.toLowerCase()))}
function calendarHtml(){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let cells='';for(let i=0;i<42;i++){let n,dt,dim=false;if(i<offset){n=prev-offset+i+1;dt=new Date(y,m-1,n);dim=true}else if(i>=offset+days){n=i-offset-days+1;dt=new Date(y,m+1,n);dim=true}else{n=i-offset+1;dt=new Date(y,m,n)}let d=iso(dt),has=state.tasks.some(t=>t.date===d),count=state.tasks.filter(t=>t.date===d).length;cells+=`<button class="day ${dim?'dim':''} ${d===selectedDate?'selected':''} ${d===today()?'today':''}" data-day="${d}">${n}${has?`<div class="dot" style="${d===selectedDate?'background:white':''}"></div>`:''}</button>`}let dayTasks=state.tasks.filter(t=>t.date===selectedDate).sort((a,b)=>a.done-b.done);return `<div class="card"><div class="calendar-head"><button data-month="-1">‹ 上月</button><b>${y}年${m+1}月</b><button data-month="1">下月 ›</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="dow">周${x}</div>`).join('')}${cells}</div><div class="muted" style="margin-top:12px">点击日期查看当天的任务。带圆点表示有计划。</div></div><div class="section-head"><h2>${selectedDate} 的计划</h2><button class="primary" data-new-task>＋ 添加</button></div>${dayTasks.map(taskCard).join('')||empty('这一天还没有计划')}</div>`}
function statsHtml(){let total=state.tasks.length,done=state.tasks.filter(t=>t.done).length,active=total-done,notes=state.notes.length,rate=total?Math.round(done/total*100):0;let cats={};state.tasks.forEach(t=>{let c=t.category||'默认';cats[c]??={total:0,done:0};cats[c].total++;if(t.done)cats[c].done++});let catRows=Object.entries(cats).sort((a,b)=>b[1].total-a[1].total).map(([c,v])=>`<div class="barrow"><span>${esc(c)}</span><div class="bar"><span style="width:${v.total?v.done/v.total*100:0}%"></span></div><span>${v.done}/${v.total}</span></div>`).join('');let last7=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=iso(d),arr=state.tasks.filter(t=>t.date===key),n=arr.filter(t=>t.done).length;last7.push({label:(d.getMonth()+1)+'/'+d.getDate(),total:arr.length,done:n})}let max=Math.max(1,...last7.map(x=>x.total));return `<div class="section-head"><h2>数据总览</h2><span class="muted">持续记录，持续进步</span></div><div class="grid2"><div class="statbox"><strong>${total}</strong><small>计划总数</small></div><div class="statbox"><strong>${done}</strong><small>已完成计划</small></div><div class="statbox"><strong>${active}</strong><small>待完成计划</small></div><div class="statbox"><strong>${notes}</strong><small>备忘录条数</small></div></div><div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between"><b>总体完成率</b><b>${rate}%</b></div><div class="progress" style="height:12px"><span style="width:${rate}%"></span></div><div class="muted" style="margin-top:8px">按已完成计划数计算</div></div><div class="card"><b>最近 7 天 · 每日计划</b>${last7.map(x=>`<div class="barrow"><span>${x.label}</span><div class="bar" style="height:13px"><span style="width:${x.total/max*100}%;background:#b5cbb8"></span><span style="width:${x.total?x.done/max*100:0}%;background:#416b55;margin-top:-13px;position:relative"></span></div><span>${x.done}/${x.total}</span></div>`).join('')}<div class="muted">深色部分代表已完成，浅色部分代表总计划量。</div></div><div class="card"><b>分类完成情况</b>${catRows||'<div class="muted" style="margin-top:10px">添加计划后，这里会显示分类统计。</div>'}</div><div class="card"><b>数据管理</b><p class="muted">数据默认保存在当前浏览器或应用的本地存储中。建议定期导出备份。</p><div class="task-actions"><button class="secondary" id="exportBtn2">导出 JSON 备份</button><button class="secondary" id="importBtn">导入备份</button><button class="danger" id="clearBtn">清空全部数据</button></div></div>`}
function historyHtml(){let h=state.history;return `<div class="section-head"><h2>修改记录</h2><span class="muted">最近 ${h.length} 条</span></div><input class="search" id="historySearch" placeholder="搜索记录标题或操作…" value="${esc(searchText)}">${h.filter(x=>(x.title+' '+x.action+' '+x.type).toLowerCase().includes(searchText.toLowerCase())).map(x=>`<div class="card"><div class="history-item"><b>${esc(x.title||'未命名')} · ${esc(x.action)}</b><div><span class="pill">${x.type==='task'?'计划':'备忘录'}</span></div><time>${fmt(x.at)}</time><p>修改前：${esc(summarize(x.before))}</p><p>修改后：${esc(summarize(x.after))}</p></div></div>`).join('')||empty('暂无修改记录')}`}
function summarize(v){if(v==null)return '（无）';if(typeof v!=='object')return String(v);if(v.title!==undefined&&v.content!==undefined)return `标题：${v.title||'无标题'}；内容：${(v.content||'').slice(0,180)}`;return `标题：${v.title||''}；日期：${v.date||'未设置'}；状态：${v.done?'已完成':'未完成'}；进度：${v.progress||0}%；分类：${v.category||'默认'}${v.description?'；描述：'+v.description.slice(0,120):''}`}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function taskForm(t={}){let isEdit=!!t.id;openModal(isEdit?'编辑计划':'新建计划',`<form id="taskForm"><div class="field"><label>计划名称 *</label><input name="title" required maxlength="160" placeholder="例如：完成每周总结" value="${esc(t.title||'')}"></div><div class="field"><label>详细说明</label><textarea name="description" placeholder="补充目标、步骤或备注…">${esc(t.description||'')}</textarea></div><div class="grid2"><div class="field"><label>计划日期</label><input type="date" name="date" value="${esc(t.date||selectedDate||today())}"></div><div class="field"><label>截止日期（可选）</label><input type="date" name="due" value="${esc(t.due||'')}"></div><div class="field"><label>分类</label><input name="category" maxlength="40" value="${esc(t.category||'个人')}" placeholder="工作 / 学习 / 生活"></div><div class="field"><label>优先级</label><select name="priority"><option ${t.priority==='普通'||!t.priority?'selected':''}>普通</option><option ${t.priority==='高'?'selected':''}>高</option><option ${t.priority==='低'?'selected':''}>低</option></select></div></div><div class="field"><label>进度：<span id="progressLabel">${t.done?100:t.progress||0}%</span></label><input type="range" name="progress" min="0" max="100" step="5" value="${t.done?100:t.progress||0}" style="width:100%"></div><div class="field"><label><input type="checkbox" name="done" ${t.done?'checked':''} style="width:auto"> 已完成</label></div><div class="form-actions"><button type="button" class="secondary" id="cancelForm">取消</button><button class="primary" type="submit">保存计划</button></div></form>`);$('#cancelForm').onclick=closeModal;let f=$('#taskForm');f.progress.oninput=()=>$('#progressLabel').textContent=f.progress.value+'%';f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f),now=stamp(),obj={id:t.id||uid(),title:fd.get('title').trim(),description:fd.get('description').trim(),date:fd.get('date'),due:fd.get('due'),category:fd.get('category').trim()||'默认',priority:fd.get('priority'),progress:fd.get('done')==='on'?100:Number(fd.get('progress')),done:fd.get('done')==='on',createdAt:t.createdAt||now,updatedAt:now};let before=isEdit?structuredClone(t):null;if(isEdit){state.tasks=state.tasks.map(x=>x.id===t.id?obj:x);logChange('task',obj.id,obj.title,before,obj,'修改')}else{state.tasks.push(obj);logChange('task',obj.id,obj.title,null,obj,'新建')}save();closeModal();render();toast('计划已保存')}}
function noteForm(n={}){let isEdit=!!n.id;openModal(isEdit?'编辑备忘录':'新建备忘录',`<form id="noteForm"><div class="field"><label>标题</label><input name="title" maxlength="160" placeholder="给这条记录起个标题" value="${esc(n.title||'')}"></div><div class="field"><label>内容</label><textarea name="content" style="min-height:180px" placeholder="记下你的想法、灵感或重要信息…">${esc(n.content||'')}</textarea></div><div class="field"><label>分类</label><input name="category" maxlength="40" value="${esc(n.category||'随手记')}" placeholder="工作 / 灵感 / 生活"></div><div class="form-actions"><button type="button" class="secondary" id="cancelForm">取消</button><button class="primary" type="submit">保存备忘</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#noteForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),now=stamp(),obj={id:n.id||uid(),title:fd.get('title').trim()||'无标题',content:fd.get('content').trim(),category:fd.get('category').trim()||'随手记',createdAt:n.createdAt||now,updatedAt:now};let before=isEdit?structuredClone(n):null;if(isEdit){state.notes=state.notes.map(x=>x.id===n.id?obj:x);logChange('note',obj.id,obj.title,before,obj,'修改')}else{state.notes.push(obj);logChange('note',obj.id,obj.title,null,obj,'新建')}save();closeModal();render();toast('备忘录已保存')}}
function toggleTask(id,checked){let t=state.tasks.find(x=>x.id===id);if(!t)return;let before=structuredClone(t);t.done=checked;t.progress=checked?100:Math.min(t.progress||0,95);t.updatedAt=stamp();logChange('task',id,t.title,before,t,checked?'标记完成':'取消完成');render();toast(checked?'已完成 ✓':'已恢复为未完成')}
function deleteThing(type,id){let arr=type==='task'?state.tasks:state.notes,idx=arr.findIndex(x=>x.id===id);if(idx<0)return;let obj=structuredClone(arr[idx]);if(!confirm(`确定删除“${obj.title||'无标题'}”吗？删除操作也会记录在历史中。`))return;arr.splice(idx,1);logChange(type,id,obj.title,obj,null,'删除');render();toast('已删除')}
function showItemHistory(type,id){let list=state.history.filter(h=>h.type===type&&h.entityId===id);openModal('这条内容的修改历史',list.length?list.map(x=>`<div class="history-item"><b>${esc(x.action)}</b><br><time>${fmt(x.at)}</time><p>修改前：${esc(summarize(x.before))}</p><p>修改后：${esc(summarize(x.after))}</p></div>`).join(''):'<div class="empty">暂无历史记录</div>')}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:stamp(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='拾光计划备份-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('备份文件已导出')}
function importData(file){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.notes)||!Array.isArray(d.history))throw Error('格式不正确');if(!confirm('导入将替换当前所有数据，建议先导出备份。确定继续吗？'))return;state={tasks:d.tasks,notes:d.notes,history:d.history};save();render();toast('备份导入成功')}catch(e){alert('无法导入：文件格式不正确')}};r.readAsText(file)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view)go(b.dataset.view);if(b.hasAttribute('data-new-task'))taskForm();if(b.hasAttribute('data-new-note'))noteForm();if(b.hasAttribute('data-go-plans'))go('plans');if(b.dataset.editTask){let t=state.tasks.find(x=>x.id===b.dataset.editTask);if(t)taskForm(structuredClone(t))}if(b.dataset.editNote){let n=state.notes.find(x=>x.id===b.dataset.editNote);if(n)noteForm(structuredClone(n))}if(b.dataset.deleteTask)deleteThing('task',b.dataset.deleteTask);if(b.dataset.deleteNote)deleteThing('note',b.dataset.deleteNote);if(b.dataset.historyId)showItemHistory(b.dataset.historyType,b.dataset.historyId);if(b.dataset.filter){planFilter=b.dataset.filter;render()}if(b.dataset.day){selectedDate=b.dataset.day;render()}if(b.dataset.month){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(b.dataset.month),1);render()}if(b.id==='quickAdd'){if(view==='notes')noteForm();else taskForm()}if(b.id==='backupBtn'||b.id==='exportBtn2')exportData();if(b.id==='importBtn')$('#importFile').click();if(b.id==='clearBtn'&&confirm('确定清空所有计划、备忘录和修改记录？此操作无法撤销。')){state={tasks:[],notes:[],history:[]};save();render();toast('数据已清空')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]'))toggleTask(e.target.dataset.check,e.target.checked);if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'||e.target.id==='noteSearch'||e.target.id==='historySearch'){let pos=e.target.selectionStart;searchText=e.target.value;let id=e.target.id;render();let newEl=$('#'+id);if(newEl){newEl.focus();newEl.setSelectionRange(pos,pos)}}});
$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
</script>
</body></html>
